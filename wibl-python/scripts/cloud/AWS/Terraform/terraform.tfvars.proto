# ---------------------------
# Values that must be changed
# ---------------------------

region = "us-east-2"

DCDB_provider_id = "UNHJHC"

superuser_username = "foo"
superuser_password = "bar"

# Run the generate_secret.sh script to create a unique secret key value, copy the value outputted into the quotation marks
# of the variable below.
frontend_secret_key = "default_test_dev_key__"

# Run the generate_secret.sh again and put the new value here as well.
origin_secret = "default"

# 1 = Use the production DCDB URL, 0 = Use the test DCDB URL
DCDB_mode = 0

# ----------------------------------
# Values that are optional to change
# ----------------------------------

# Size of the database in Gigabytes
manager_db_size = "5"

manager_db_user = "postgres"
manager_db_password = "test_test"

# Size of the database in Gigabytes
frontend_db_size = "5"

frontend_db_user = "postgres"
frontend_db_password = "test_test"

# -------------------------------------
# Values that do not need to be changed
# -------------------------------------

terraform_state_bucket = "${PROVIDER_PREFIX}-wibl-tf-state"
terraform_state_key = "terraform/state/wibl-processing-server-deploy.tfstate"

incoming_bucket_name  = "${PROVIDER_PREFIX}-wibl-incoming-bucket"
staging_bucket_name   = "${PROVIDER_PREFIX}-wibl-staging-bucket-gt"
viz_bucket_name       = "${PROVIDER_PREFIX}-wibl-viz-bucket"
static_bucket_name = "${PROVIDER_PREFIX}-wibl-static-files-bucket"

conversion_lambda_name = "${PROVIDER_PREFIX}-wibl-conversion-lambda"
conversion_start_lambda_name = "${PROVIDER_PREFIX}-wibl-conversion-start-lambda"
viz_lambda_name = "${PROVIDER_PREFIX}-wibl-viz-lambda"
validation_lambda_name = "${PROVIDER_PREFIX}-wibl-validation-lambda"
submission_lambda_name = "${PROVIDER_PREFIX}-wibl-submission-lambda"

conversion_topic_name = "${PROVIDER_PREFIX}-wibl-conversion-topic"
validation_topic_name = "${PROVIDER_PREFIX}-wibl-validation-topic"
submission_topic_name = "${PROVIDER_PREFIX}-wibl-submission-topic"
submitted_topic_name = "${PROVIDER_PREFIX}-wibl-submitted-topic"

conversion_lambda_role_name = "${PROVIDER_PREFIX}-wibl-conversion-lambda-role"
conversion_start_lambda_role_name = "${PROVIDER_PREFIX}-wibl-conversion-start-lambda-role"
validation_lambda_role_name = "${PROVIDER_PREFIX}-wibl-validation-lambda-role"
submission_lambda_role_name = "${PROVIDER_PREFIX}-wibl-submission-lambda-role"
viz_lambda_role_name = "${PROVIDER_PREFIX}-wibl-viz-lambda-role"

DCDB_test_url = "https://www.ngdc.noaa.gov/ingest-external/upload/csb/test/geojson/"
DCDB_prod_url = "https://www.ngdc.noaa.gov/ingest-external/upload/csb/geojson/"

map_name = "${PROVIDER_PREFIX}-open-layers-map"

manager_db_name = "${PROVIDER_PREFIX}-wibl-manager-DB"
frontend_db_name = "${PROVIDER_PREFIX}-wibl-frontend-DB"

# 1 = debug mode is on, 0 = debug mode is off
debug_mode = 0
